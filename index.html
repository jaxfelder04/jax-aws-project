<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Active Directory Dashboard</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="overlay"></div>

<div class="container">

<header>

<h1>Enterprise Active Directory Dashboard</h1>

<p>Windows Server User Administration Simulator</p>

</header>

<div class="stats">

<div class="card">
<h3>Total Users</h3>
<span id="totalUsers">0</span>
</div>

<div class="card">
<h3>Active Users</h3>
<span id="activeUsers">0</span>
</div>

<div class="card">
<h3>Locked Users</h3>
<span id="lockedUsers">0</span>
</div>

<div class="card">
<h3>Disabled Users</h3>
<span id="disabledUsers">0</span>
</div>

</div>

<div class="admin-panel">

<h2>Create New Employee</h2>

<input id="name" placeholder="Full Name">

<input id="username" placeholder="Username">

<select id="department">
<option>IT</option>
<option>Finance</option>
<option>Human Resources</option>
<option>Operations</option>
<option>Sales</option>
</select>

<select id="group">
<option>Domain Users</option>
<option>Help Desk</option>
<option>IT Admins</option>
<option>Finance Users</option>
<option>HR Users</option>
</select>

<button onclick="createUser()">
Create Employee
</button>

</div>

<div class="search-area">

<input
type="text"
id="search"
placeholder="Search Employee..."
onkeyup="displayUsers()">

</div>

<div id="userContainer">

</div>

</div>

<script src="script.js"></script>

</body>
</html>
